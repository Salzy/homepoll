name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: homepoll
          POSTGRES_PASSWORD: homepoll
          POSTGRES_DB: homepoll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homepoll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: make test-all

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy Grafana files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "grafana/provisioning,grafana/dashboards"
          target: ${{ vars.GRAFANA_PATH }}
          strip_components: 1
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variables
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          ETA_HOST: ${{ vars.ETA_HOST }}
          ETA_PORT: ${{ vars.ETA_PORT }}
          POWER_HOST: ${{ vars.POWER_HOST }}
          # Host network: bind to loopback or Tailscale only.
          MCP_ADDR: ${{ vars.MCP_ADDR }}
          # Secrets
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POWER_TOKEN: ${{ secrets.POWER_TOKEN }}
          POWER_GPNR: ${{ secrets.POWER_GPNR }}
          POWER_ZP: ${{ secrets.POWER_ZP }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,POSTGRES_HOST,POSTGRES_PORT,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,ETA_HOST,ETA_PORT,POWER_HOST,POWER_TOKEN,POWER_GPNR,POWER_ZP,GRAFANA_PASSWORD,MCP_ADDR,MCP_TOKEN
          script: |
            echo "Updating container..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop homepoll-collector || true
            docker rm homepoll-collector || true
            docker run -d --name homepoll-collector \
              --restart unless-stopped \
              --network host \
              -e POSTGRES_HOST \
              -e POSTGRES_PORT \
              -e POSTGRES_USER \
              -e POSTGRES_PASSWORD \
              -e POSTGRES_DB \
              -e ETA_HOST \
              -e ETA_PORT \
              -e POWER_HOST \
              -e POWER_TOKEN \
              -e POWER_GPNR \
              -e POWER_ZP \
              -e MCP_ADDR \
              -e MCP_TOKEN \
              ghcr.io/${{ github.repository }}:latest

            # Dashboards hot-reload; datasources need an explicit reload.
            echo "Reloading Grafana provisioning..."
            curl -fsS -X POST -u "admin:$GRAFANA_PASSWORD" \
              http://localhost:3000/api/admin/provisioning/datasources/reload
