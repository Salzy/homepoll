apiVersion: 1
datasources:
  - name: Homepoll
    uid: homepoll_pg
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
