# Reads HOMEPOLL_DB_* from Grafana's environment; prefixed so a shared
# Grafana can provision datasources for several apps.
apiVersion: 1
datasources:
  - name: Homepoll
    uid: homepoll_pg
    type: postgres
    access: proxy
    url: ${HOMEPOLL_DB_HOST}:${HOMEPOLL_DB_PORT}
    user: ${HOMEPOLL_DB_USER}
    isDefault: true
    jsonData:
      database: ${HOMEPOLL_DB_NAME}
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: ${HOMEPOLL_DB_PASSWORD}
